<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Sentinel · โน้ตส่วนตัว</title>
  <meta name="theme-color" content="#0c0d10" id="theme-color-meta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('sentinel-theme')==='light'?'light':'dark'}catch(_){}</script>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/notes.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="/static/js/app.js" defer></script>
  <script src="/static/js/components/notes.js" defer></script>
</head>
<body class="app-body">
  <svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
    <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s-7-5.75-7-12a7 7 0 1 1 14 0c0 6.25-7 12-7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  </svg>

  <header class="topbar" x-data>
    <div class="brand"><span class="brand-dot" style="background:var(--blue)"></span><span>โน้ตส่วนตัว</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" type="button" @click="$store.sentinel.toggleTheme()" aria-label="สลับธีม"><svg class="icon"><use href="#i-theme"/></svg></button>
    </div>
  </header>

  <main class="shell notes-shell" x-data="notesComponent()">
    <!-- Search & Filter Bar -->
    <section class="notes-toolbar">
      <div class="search-box">
        <svg class="icon"><use href="#i-search"/></svg>
        <input type="search" x-model="searchQuery" @input.debounce.250ms="loadNotes()" placeholder="ค้นหาโน้ต รายการ หรือ #แท็ก...">
      </div>
      <div class="filter-pills" role="tablist" aria-label="ตัวกรองโน้ต">
        <button type="button" class="pill-tab" :class="{ active: filterMode === 'active' }" @click="setFilter('active')">ทั้งหมด</button>
        <button type="button" class="pill-tab" :class="{ active: filterMode === 'pinned' }" @click="setFilter('pinned')">📌 ปักหมุด</button>
        <button type="button" class="pill-tab" :class="{ active: filterMode === 'archived' }" @click="setFilter('archived')">📦 คลังเก็บ</button>
      </div>
    </section>

    <!-- Quick Capture Composer -->
    <section class="composer-card" :class="{ expanded: composerOpen }">
      <div class="composer-collapsed" x-show="!composerOpen">
        <input type="text" class="composer-trigger" readonly placeholder="จดด่วน... (พิมพ์โน้ต หรือสร้างเช็กลิสต์)" @click="openComposer('note')">
        <button type="button" class="composer-mode-btn" title="สร้างเช็กลิสต์" @click="openComposer('checklist')">☑️ ลิสต์</button>
      </div>

      <form class="composer-form" x-show="composerOpen" x-cloak @submit.prevent="createNote()">
        <div class="composer-top">
          <input type="text" class="composer-title" x-model="draft.title" placeholder="หัวข้อ (ไม่บังคับ)">
          <div class="composer-type-switch">
            <button type="button" :class="{ active: draft.kind === 'note' }" @click="switchDraftKind('note')">📝 โน้ต</button>
            <button type="button" :class="{ active: draft.kind === 'checklist' }" @click="switchDraftKind('checklist')">☑️ ลิสต์</button>
          </div>
        </div>

        <template x-if="draft.kind === 'note'">
          <textarea class="composer-textarea" rows="3" x-model="draft.content" placeholder="เขียนรายละเอียด... (กด Ctrl+Enter เพื่อบันทึก)" @keydown.ctrl.enter.prevent="createNote()" @keydown.meta.enter.prevent="createNote()"></textarea>
        </template>

        <template x-if="draft.kind === 'checklist'">
          <div class="checklist-editor">
            <template x-for="(item, idx) in draft.items" :key="idx">
              <div class="checklist-edit-row">
                <input type="checkbox" x-model="item.done">
                <input type="text" x-model="item.text" placeholder="รายการ..." @keydown.enter.prevent="addDraftItem()">
                <button type="button" class="mini-remove" @click="removeDraftItem(idx)" aria-label="ลบรายการ">✕</button>
              </div>
            </template>
            <button type="button" class="add-item-btn" @click="addDraftItem()"><svg class="icon"><use href="#i-plus"/></svg> เพิ่มรายการ</button>
          </div>
        </template>

        <div class="composer-footer">
          <input type="text" class="composer-tags" x-model="draft.tags" placeholder="แท็ก เช่น งาน, ซื้อของ">
          <div class="composer-actions">
            <button type="button" class="btn-ghost" :class="{ active: draft.pinned }" @click="draft.pinned = !draft.pinned" title="ปักหมุด">📌</button>
            <button type="button" class="btn-ghost" @click="closeComposer()">ยกเลิก</button>
            <button type="submit" class="btn-primary" :disabled="saving">บันทึก</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Loading / Empty -->
    <div class="notes-empty" x-show="loading">กำลังโหลดโน้ต...</div>
    <div class="notes-empty" x-show="!loading && visibleNotes.length === 0" x-cloak>
      <p>ยังไม่มีโน้ตในหมวดนี้</p>
      <small>แตะ "จดด่วน..." ด้านบน หรือพิมพ์ <code>/note ข้อความ</code> ใน Telegram ได้เลย</small>
    </div>

    <!-- Pinned Section -->
    <template x-if="!loading && pinnedNotes.length > 0">
      <section class="notes-group">
        <h2 class="group-title">📌 ปักหมุด</h2>
        <div class="notes-grid">
          <template x-for="note in pinnedNotes" :key="note.id">
            <article class="note-card pinned">
              <div class="note-card-head" @click="openEdit(note)">
                <strong x-show="note.title" x-text="note.title"></strong>
                <span class="note-time" x-text="formatDate(note.updated_at)"></span>
              </div>
              <div class="note-card-body" x-show="note.kind === 'note'" @click="openEdit(note)">
                <p x-text="note.content"></p>
              </div>
              <div class="note-checklist" x-show="note.kind === 'checklist'">
                <template x-for="(item, idx) in note.items" :key="idx">
                  <label class="check-row" :class="{ done: item.done }">
                    <input type="checkbox" :checked="item.done" @change="toggleCheckItem(note, idx)">
                    <span x-text="item.text"></span>
                  </label>
                </template>
              </div>
              <div class="note-tags" x-show="note.tags">
                <template x-for="tag in splitTags(note.tags)" :key="tag">
                  <button type="button" class="tag-chip" @click="searchByTag(tag)" x-text="'#' + tag"></button>
                </template>
              </div>
              <div class="note-actions">
                <button type="button" @click="togglePin(note)" title="เลิกปักหมุด">📌</button>
                <button type="button" @click="autoTag(note)" title="AI ติดแท็ก">✨</button>
                <button type="button" @click="sendToSchedule(note)" title="ส่งไปตั้งเตือน">⏰</button>
                <button type="button" @click="openEdit(note)" title="แก้ไข">✏️</button>
                <button type="button" @click="toggleArchive(note)" title="เก็บเข้าคลัง">📦</button>
                <button type="button" class="danger" @click="deleteNote(note)" title="ลบ">🗑</button>
              </div>
            </article>
          </template>
        </div>
      </section>
    </template>

    <!-- Other Notes Section -->
    <template x-if="!loading && regularNotes.length > 0">
      <section class="notes-group">
        <h2 class="group-title" x-show="pinnedNotes.length > 0">โน้ตอื่นๆ</h2>
        <div class="notes-grid">
          <template x-for="note in regularNotes" :key="note.id">
            <article class="note-card">
              <div class="note-card-head" @click="openEdit(note)">
                <strong x-show="note.title" x-text="note.title"></strong>
                <span class="note-time" x-text="formatDate(note.updated_at)"></span>
              </div>
              <div class="note-card-body" x-show="note.kind === 'note'" @click="openEdit(note)">
                <p x-text="note.content"></p>
              </div>
              <div class="note-checklist" x-show="note.kind === 'checklist'">
                <template x-for="(item, idx) in note.items" :key="idx">
                  <label class="check-row" :class="{ done: item.done }">
                    <input type="checkbox" :checked="item.done" @change="toggleCheckItem(note, idx)">
                    <span x-text="item.text"></span>
                  </label>
                </template>
              </div>
              <div class="note-tags" x-show="note.tags">
                <template x-for="tag in splitTags(note.tags)" :key="tag">
                  <button type="button" class="tag-chip" @click="searchByTag(tag)" x-text="'#' + tag"></button>
                </template>
              </div>
              <div class="note-actions">
                <button type="button" @click="togglePin(note)" title="ปักหมุด">📌</button>
                <button type="button" @click="autoTag(note)" title="AI ติดแท็ก">✨</button>
                <button type="button" @click="sendToSchedule(note)" title="ส่งไปตั้งเตือน">⏰</button>
                <button type="button" @click="openEdit(note)" title="แก้ไข">✏️</button>
                <button type="button" @click="toggleArchive(note)" :title="note.archived ? 'นำกลับ' : 'เก็บเข้าคลัง'">📦</button>
                <button type="button" class="danger" @click="deleteNote(note)" title="ลบ">🗑</button>
              </div>
            </article>
          </template>
        </div>
      </section>
    </template>

    <!-- Edit Modal -->
    <dialog class="note-dialog" id="note-edit-dialog" @click.self="closeEdit()">
      <form class="composer-form" @submit.prevent="saveEdit()" x-if="editing">
        <div class="composer-top">
          <input type="text" class="composer-title" x-model="editing.title" placeholder="หัวข้อ">
          <div class="composer-type-switch">
            <button type="button" :class="{ active: editing.kind === 'note' }" @click="switchEditKind('note')">📝 โน้ต</button>
            <button type="button" :class="{ active: editing.kind === 'checklist' }" @click="switchEditKind('checklist')">☑️ ลิสต์</button>
          </div>
        </div>

        <template x-if="editing.kind === 'note'">
          <textarea class="composer-textarea" rows="5" x-model="editing.content" placeholder="เนื้อหาโน้ต..."></textarea>
        </template>

        <template x-if="editing.kind === 'checklist'">
          <div class="checklist-editor">
            <template x-for="(item, idx) in editing.items" :key="idx">
              <div class="checklist-edit-row">
                <input type="checkbox" x-model="item.done">
                <input type="text" x-model="item.text" placeholder="รายการ..." @keydown.enter.prevent="addEditItem()">
                <button type="button" class="mini-remove" @click="removeEditItem(idx)">✕</button>
              </div>
            </template>
            <button type="button" class="add-item-btn" @click="addEditItem()"><svg class="icon"><use href="#i-plus"/></svg> เพิ่มรายการ</button>
          </div>
        </template>

        <div class="composer-footer">
          <input type="text" class="composer-tags" x-model="editing.tags" placeholder="แท็ก คั่นด้วย ,">
          <div class="composer-actions">
            <button type="button" class="btn-ghost" @click="closeEdit()">ปิด</button>
            <button type="submit" class="btn-primary" :disabled="saving">บันทึก</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast" x-show="toastMsg" x-text="toastMsg" x-cloak role="status"></div>
  </main>

  <nav class="task-nav" aria-label="หน้าหลัก">
    <a class="task-link" href="/?tab=overview"><svg class="icon"><use href="#i-overview"/></svg><span>ภาพรวม</span></a>
    <a class="task-link" href="/schedule"><svg class="icon"><use href="#i-calendar"/></svg><span>ตาราง</span></a>
    <a class="task-link active" href="/notes" aria-current="page"><svg class="icon"><use href="#i-note"/></svg><span>โน้ต</span></a>
    <!-- LIVE_MAP_START --><a class="task-link" href="/live"><svg class="icon"><use href="#i-pin"/></svg><span>แผนที่</span></a><!-- LIVE_MAP_END -->
    <a class="task-link" href="/relay"><svg class="icon"><use href="#i-send"/></svg><span>Telegram</span></a>
  </nav>
</body>
</html>
