<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13141a">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Sentinel">
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('sentinel-theme');
        const theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#13141a' : '#f6f6f9');
      } catch (_) {}
    })();
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/img/avatar-chubu.png">
  <title>แผนที่ — Pocket Sentinel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/live-map.css">
  <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script defer src="/static/js/components/live-map.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="live-map-body" :class="{'is-picking': placeOpen}" x-data="liveMap" x-init="init()" @keydown.escape.window="if (placeOpen) closePlace(); else if (manageOpen) closeManage(); else if (sheetExpanded) toggleSheet(false)">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 3.5V8h4.5M4 13a8 8 0 0 0 14.6 4.5M20 20.5V16h-4.5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-navigate" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></symbol>
    <symbol id="i-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
  </svg>
  <div id="live-map-canvas" role="application" aria-label="แผนที่แสดงตำแหน่งของ Chubu และ Furturia กดค้างเพื่อเพิ่มสถานที่"></div>
  <div class="map-loading" x-show="!mapReady" x-cloak><span class="spinner"></span><span x-text="mapError || 'กำลังเตรียมแผนที่…'"></span></div>

  <!-- Floating controls (top-right) -->
  <div class="map-fabs">
    <div class="map-fab-row">
      <button type="button" class="btn-icon map-glass map-live-btn" @click="refresh()" :aria-label="connected ? `อัปเดตสด · ${updatedText} · แตะเพื่อรีเฟรช` : 'รอเชื่อมต่อ · แตะเพื่อรีเฟรช'" :title="connected ? updatedText : 'รอเชื่อมต่อ'"><span class="live-dot" :class="{'is-live': connected}"></span></button>
      <button class="btn-icon theme-toggle-btn map-glass" id="theme-toggle" type="button" @click="toggleTheme()" :aria-label="theme === 'dark' ? 'เปลี่ยนเป็นโหมดสว่าง' : 'เปลี่ยนเป็นโหมดมืด'"><svg class="icon icon-sun"><use href="#i-sun"/></svg><svg class="icon icon-moon"><use href="#i-moon"/></svg></button>
    </div>
    <button type="button" class="btn-icon map-glass" :class="{'is-active': manageOpen}" @click="manageOpen ? closeManage() : openManage()" aria-label="จัดการสถานที่และการแจ้งเตือน" title="จัดการ"><svg class="icon"><use href="#i-gear"/></svg></button>
    <button type="button" class="btn-icon map-glass" @click="centerOnDevices()" aria-label="แสดงทั้งสองคน" title="แสดงทั้งสองคน"><svg class="icon"><use href="#i-users"/></svg></button>
    <button type="button" class="btn-icon map-glass" :class="{'is-active': showTrail}" @click="toggleTrail()" :aria-pressed="showTrail" aria-label="เส้นทางย้อนหลัง 24 ชม." title="เส้นทาง 24 ชม."><svg class="icon"><use href="#i-route"/></svg></button>
    <button type="button" class="btn-icon map-glass hover-only" @click="zoomIn()" aria-label="ซูมเข้า"><svg class="icon"><use href="#i-plus"/></svg></button>
    <button type="button" class="btn-icon map-glass hover-only" @click="zoomOut()" aria-label="ซูมออก"><svg class="icon"><use href="#i-minus"/></svg></button>
  </div>

  <!-- People sheet -->
  <aside class="map-sheet" :class="{'is-expanded': sheetExpanded}" x-show="!placeOpen && !manageOpen" aria-label="ข้อมูลตำแหน่ง">
    <button type="button" class="sheet-handle" @pointerdown="sheetPointerDown($event)" @keydown.enter.prevent="toggleSheet()" @keydown.space.prevent="toggleSheet()" :aria-expanded="sheetExpanded" aria-label="ขยายหรือย่อรายละเอียด"><span class="sheet-grab"></span></button>

    <div class="friend-row" aria-live="polite">
      <img class="friend-avatar" src="/static/img/avatar-furturia.png" alt="Furturia">
      <div class="grow">
        <strong class="friend-headline" x-text="friendHeadline()">ยังไม่มีพิกัดของ Furturia</strong>
        <small class="friend-sub" x-text="friendSubline()"></small>
      </div>
    </div>
    <div class="shortcut-row">
      <button type="button" class="btn btn-sm" @click="navigateToFriend()" :disabled="!friend"><svg class="icon icon-sm"><use href="#i-navigate"/></svg>นำทาง</button>
      <button type="button" class="btn btn-sm" @click="copyFriendCoords()" :disabled="!friend"><svg class="icon icon-sm"><use href="#i-copy"/></svg>คัดลอกพิกัด</button>
      <button type="button" class="btn btn-ghost btn-sm more-btn" @click="toggleSheet()" x-text="sheetExpanded ? 'ย่อ' : 'เพิ่มเติม'"></button>
    </div>

    <div class="sheet-more">
      <p class="alert err" x-show="errorText" x-text="errorText" x-cloak></p>
      <section class="sheet-section" aria-label="ข้อมูลอุปกรณ์">
        <template x-for="d in [{key:'friend', name:'Furturia', img:'/static/img/avatar-furturia.png'}, {key:'me', name:'Chubu', img:'/static/img/avatar-chubu.png'}]" :key="d.key">
          <article class="device-card">
            <div class="device-head">
              <img :src="d.img" :alt="d.name">
              <div class="grow"><strong x-text="d.name"></strong><small x-text="deviceAge(d.key === 'me' ? me : friend)"></small></div>
              <span class="chip" :class="{'ok': connectionStatus(d.key === 'me' ? me : friend).class === 'live', 'warn': connectionStatus(d.key === 'me' ? me : friend).class === 'stale'}" x-text="connectionStatus(d.key === 'me' ? me : friend).label"></span>
            </div>
            <div class="device-metrics">
              <div><span>แบต</span><strong x-text="batteryText(d.key === 'me' ? me : friend)"></strong><div class="batt-track"><div class="batt-fill" :class="batteryBarClass(d.key === 'me' ? me : friend)" :style="`width:${batteryPercent(d.key === 'me' ? me : friend)}%`"></div></div></div>
              <div><span>ความเร็ว</span><strong x-text="speedText(d.key === 'me' ? me : friend)"></strong></div>
              <div><span>ความแม่นยำ</span><strong x-text="accuracyText(d.key === 'me' ? me : friend)"></strong></div>
            </div>
          </article>
        </template>
      </section>

      <details class="sheet-section card disclosure" :open="showLogs" @toggle="showLogs = $el.open">
        <summary>บันทึกพิกัดล่าสุด <small class="muted" x-text="`${recentLogs.length} รายการ`"></small></summary>
        <template x-if="recentLogs.length === 0"><p class="empty">กำลังรอพิกัดจากเครื่อง…</p></template>
        <ul class="log-list">
          <template x-for="log in recentLogs" :key="log.id + '-' + log.device">
            <li class="log-item">
              <img :src="log.device === 'me' ? '/static/img/avatar-chubu.png' : '/static/img/avatar-furturia.png'" :alt="log.name">
              <div class="grow"><strong x-text="log.name"></strong><small x-text="formatTimeDetail(log.recorded_at)"></small></div>
              <small class="log-meta" x-text="`${log.battery_level}% · ${log.speed < 1 ? 'นิ่ง' : log.speed + ' km/h'} · ±${Math.round(log.accuracy)} ม.`"></small>
            </li>
          </template>
        </ul>
      </details>
      <p class="sheet-footnote">รีเฟรชอัตโนมัติทุก 15 วินาที · กดค้างบนแผนที่เพื่อเพิ่มสถานที่</p>
    </div>
  </aside>

  <!-- Manage sheet: places + notifications (rarely edited) -->
  <aside class="manage-sheet bottom-panel" x-show="manageOpen" x-cloak role="dialog" aria-labelledby="manage-title">
    <div class="panel-head">
      <h2 id="manage-title">จัดการ</h2>
      <button type="button" class="btn-icon" @click="closeManage()" aria-label="ปิด"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="segmented panel-tabs" role="tablist">
      <button type="button" role="tab" :aria-selected="manageTab === 'places'" :class="{active: manageTab === 'places'}" @click="manageTab = 'places'">สถานที่ <span x-text="`(${geofences.length})`"></span></button>
      <button type="button" role="tab" :aria-selected="manageTab === 'notify'" :class="{active: manageTab === 'notify'}" @click="manageTab = 'notify'">แจ้งเตือน</button>
    </div>

    <section x-show="manageTab === 'places'" class="panel-body">
      <p class="alert err" x-show="geofenceError" x-text="geofenceError" role="alert" x-cloak></p>
      <template x-if="geofences.length === 0"><p class="empty">ยังไม่มีสถานที่ · กดค้างบนแผนที่ หรือกดปุ่มด้านล่าง</p></template>
      <ul class="list place-list">
        <template x-for="zone in orderedGeofences" :key="zone.id">
          <li><button type="button" class="list-item place-item" @click="openPlace(zone)">
            <span class="grow"><strong x-text="zone.name"></strong><small x-text="`รัศมี ${zone.radius_meters} ม. · ${zone.notify_enter && zone.notify_exit ? 'แจ้งเมื่อถึงและออก' : zone.notify_enter ? 'แจ้งเมื่อถึง' : zone.notify_exit ? 'แจ้งเมื่อออก' : 'ไม่แจ้งเตือน'}`"></small></span>
            <svg class="icon" style="color:var(--muted)"><use href="#i-right"/></svg>
          </button></li>
        </template>
      </ul>
      <button type="button" class="btn btn-primary btn-block" @click="openPlace()"><svg class="icon icon-sm"><use href="#i-plus"/></svg>เพิ่มสถานที่</button>
    </section>

    <section x-show="manageTab === 'notify'" class="panel-body">
      <div class="list">
        <label class="list-item toggle-row"><span class="grow"><strong>พบกัน / แยกย้าย</strong><small>อยู่ด้วยกัน (≤ 80 ม.) หรือแยกกัน (≥ 250 ม.)</small></span><input class="switch" type="checkbox" x-model="settings.notify_colocation" @change="saveSettings()"></label>
        <label class="list-item toggle-row"><span class="grow"><strong>เข้า / ออกสถานที่</strong><small>เมื่อมาถึงหรือออกจากสถานที่ที่บันทึกไว้</small></span><input class="switch" type="checkbox" x-model="settings.notify_geofence" @change="saveSettings()"></label>
        <label class="list-item toggle-row"><span class="grow"><strong>แบตเตอรี่ต่ำ</strong><small>ต่ำกว่า 15% และไม่ได้ชาร์จ</small></span><input class="switch" type="checkbox" x-model="settings.notify_battery" @change="saveSettings()"></label>
      </div>
      <p class="muted settings-msg" x-show="settingsMessage" x-text="settingsMessage"></p>
      <div class="pin-row">
        <label class="field grow">Relay PIN <small>เก็บไว้บนอุปกรณ์นี้เท่านั้น</small>
          <span class="pin-input"><input :type="showPin ? 'text' : 'password'" x-model="pin" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><button type="button" class="btn btn-ghost btn-sm" @click="showPin = !showPin" x-text="showPin ? 'ซ่อน' : 'แสดง'"></button></span>
        </label>
        <button type="button" class="btn" @click="savePinExplicit()" x-text="pinSavedNotice ? 'บันทึกแล้ว ✓' : 'บันทึก'"></button>
      </div>
    </section>
  </aside>

  <!-- Add / edit place (one step) -->
  <aside class="place-sheet bottom-panel" x-show="placeOpen" x-cloak role="dialog" aria-labelledby="place-title">
    <div class="panel-head">
      <h2 id="place-title" x-text="placeEditId != null ? 'แก้ไขสถานที่' : 'เพิ่มสถานที่'"></h2>
      <button type="button" class="btn-icon" @click="closePlace()" aria-label="ปิด"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel-body">
      <div class="point-buttons">
        <button type="button" class="btn btn-sm" @click="useDevicePoint('me')" :disabled="!me"><svg class="icon icon-sm"><use href="#i-crosshair"/></svg>ตรงที่ฉันอยู่</button>
        <button type="button" class="btn btn-sm" @click="useDevicePoint('friend')" :disabled="!friend"><svg class="icon icon-sm"><use href="#i-crosshair"/></svg>ตรงที่ Furturia อยู่</button>
      </div>
      <form class="link-row" @submit.prevent="applyLink()">
        <input class="input" type="text" x-model="linkInput" placeholder="วางลิงก์ Google Maps หรือ lat, lng" inputmode="url" autocomplete="off" @paste="$nextTick(() => applyLink())">
        <button type="submit" class="btn" :disabled="linkBusy || !linkInput.trim()" x-text="linkBusy ? '…' : 'ใช้'"></button>
      </form>
      <p class="point-readout" x-text="newZone.latitude == null ? 'ยังไม่ได้เลือกตำแหน่ง · กดค้างบนแผนที่ได้เลย' : `พิกัด ${newZone.latitude.toFixed(5)}, ${newZone.longitude.toFixed(5)} · ลากหมุดเพื่อปรับ`"></p>

      <label class="field">ชื่อ<input id="place-name" type="text" x-model="newZone.name" placeholder="เช่น บ้าน, ที่ทำงาน" maxlength="80" autocomplete="off"></label>

      <div class="field">
        <span class="radius-label">รัศมี <strong x-text="`${newZone.radius_meters} ม.`"></strong></span>
        <input id="place-radius-slider" class="radius-range" type="range" min="50" max="2000" step="25" x-model.number="radiusSlider" @input="applyRadiusSlider()" :aria-valuetext="`${radiusSlider} เมตร`">
      </div>

      <div class="field">
        <span>แจ้งเมื่อ</span>
        <div class="choice-row">
          <label><input type="checkbox" x-model="newZone.notify_enter"><span>มาถึง</span></label>
          <label><input type="checkbox" x-model="newZone.notify_exit"><span>ออกไป</span></label>
        </div>
      </div>

      <p class="form-error" x-text="placeError" role="alert"></p>
      <div class="panel-actions">
        <button type="button" class="btn btn-ghost btn-danger" x-show="placeEditId != null" @click="removePlace()">ลบ</button>
        <button type="button" class="btn btn-primary grow" :disabled="savingZone" @click="savePlace()" x-text="savingZone ? 'กำลังบันทึก…' : 'บันทึก'"></button>
      </div>
    </div>
  </aside>

  <div class="toast" :class="{show: toastText}" x-text="toastText" role="status" aria-live="polite"></div>
  <nav class="task-nav" aria-label="หน้าหลัก">
    <a class="task-link" href="/?tab=overview"><svg class="icon"><use href="#i-overview"/></svg><span>ภาพรวม</span></a>
    <a class="task-link" href="/schedule"><svg class="icon"><use href="#i-calendar"/></svg><span>ตาราง</span></a>
    <a class="task-link active" href="/live" aria-current="page"><svg class="icon"><use href="#i-pin"/></svg><span>แผนที่</span></a>
    <a class="task-link" href="/relay"><svg class="icon"><use href="#i-send"/></svg><span>Telegram</span></a>
  </nav>
</body>
</html>
