<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Telegram Bridge — Pocket Sentinel</title>
  <meta name="description" content="Forward notes, photos & files directly to your Telegram chat from Pocket Sentinel v11.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#13141a">
  <script>
    (() => {
      const savedTheme = localStorage.getItem('sentinel-theme');
      document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/relay.css">
  <script defer src="/static/js/components/relay.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="tele-bridge-page" x-data="relayComponent()">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 3.5V8h4.5M4 13a8 8 0 0 0 14.6 4.5M20 20.5V16h-4.5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-navigate" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></symbol>
    <symbol id="i-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
  </svg>
  <header class="topbar">
    <a class="brand" href="/"><span class="status-dot" aria-hidden="true"></span><span class="brand-name">Telegram Bridge</span></a>
    <div class="topbar-actions">
      <button class="btn-icon theme-toggle-btn" id="theme-toggle" type="button" @click="toggleTheme()" :aria-label="theme === 'dark' ? 'เปลี่ยนเป็นโหมดสว่าง' : 'เปลี่ยนเป็นโหมดมืด'"><svg class="icon icon-sun"><use href="#i-sun"/></svg><svg class="icon icon-moon"><use href="#i-moon"/></svg></button>
    </div>
  </header>

  <main class="page relay-page">
    <p class="relay-intro">ส่งข้อความ รูปภาพ หรือไฟล์เข้าแชท Telegram ของคุณ</p>

    <!-- Mode switch -->
    <div class="segmented relay-tabs" role="tablist" aria-label="ประเภทที่จะส่ง">
      <button class="relay-tab-btn" role="tab" :class="{ active: activeTab === 'text' }" :aria-selected="activeTab === 'text'" @click="activeTab = 'text'" type="button">ข้อความ</button>
      <button class="relay-tab-btn" role="tab" :class="{ active: activeTab === 'file' }" :aria-selected="activeTab === 'file'" @click="activeTab = 'file'" type="button">ไฟล์ / รูปภาพ</button>
    </div>

    <!-- Text mode -->
    <section class="relay-tab-content" x-show="activeTab === 'text'">
      <div class="template-strip" aria-label="ข้อความสำเร็จรูป">
        <template x-for="template in messageTemplates" :key="template.label">
          <button type="button" class="relay-template-btn" @click="useTemplate(template)" x-text="template.label"></button>
        </template>
      </div>
      <div class="card composer">
        <textarea id="relay-message-input" x-model="messageText" rows="6" placeholder="พิมพ์ข้อความของคุณ…" maxlength="4000"></textarea>
        <div class="composer-bar">
          <span class="char-count" x-text="(messageText.length) + '/4000'"></span>
          <button type="button" class="btn btn-sm proofread-btn" @click="proofreadText()" :disabled="isProofreading || !messageText.trim()" title="ตรวจทานภาษาและตัวสะกดด้วย AI">
            <svg class="icon icon-sm"><use href="#i-sparkle"/></svg><span x-text="isProofreading ? 'กำลังตรวจ…' : 'ตรวจทาน'"></span>
          </button>
          <button class="btn btn-sm btn-primary composer-send-btn" type="button" :disabled="isSending || !messageText.trim()" @click="submit()" aria-label="ส่งข้อความ">
            <svg class="icon icon-sm"><use href="#i-send"/></svg><span>ส่ง</span>
          </button>
        </div>
      </div>
      <p class="shortcut-tip"><kbd>⌘</kbd> + <kbd>Enter</kbd> เพื่อส่งทันที</p>

      <div class="card proofread-diff-card" x-show="showProofreadDiff" x-transition x-cloak>
        <div class="proofread-diff-header">
          <span class="chip">AI PROOFREAD</span>
          <button type="button" class="btn btn-ghost btn-sm" @click="cancelProofread()">ปิด</button>
        </div>
        <div class="diff-block">
          <div class="diff-block-title"><span>ต้นฉบับ</span><span class="chip">ข้อความเดิม</span></div>
          <p class="diff-text" x-text="proofreadOriginal"></p>
        </div>
        <div class="diff-block suggested">
          <div class="diff-block-title"><span>ที่แนะนำ</span><span class="chip" :class="proofreadHasChanges ? 'warn' : 'ok'" x-text="proofreadHasChanges ? 'มีการปรับปรุง' : 'ตรงกับต้นฉบับ'"></span></div>
          <p class="diff-text" x-text="proofreadSuggested"></p>
        </div>
        <div class="proofread-controls">
          <button type="button" class="btn btn-primary btn-block" @click="sendRevised()" :disabled="isSending">ส่งข้อความที่แนะนำ</button>
          <div class="proofread-secondary">
            <button type="button" class="btn" @click="sendOriginal()" :disabled="isSending">ส่งข้อความเดิม</button>
            <button type="button" class="btn" @click="editProofread()">แก้ไขต่อ</button>
          </div>
        </div>
      </div>
    </section>

    <!-- File mode -->
    <section class="relay-tab-content" x-show="activeTab === 'file'">
      <div class="drop-zone" :class="{ 'dragging': isDragging, 'has-file': hasFile }"
           @dragover="handleDragOver($event)" @dragleave="handleDragLeave($event)" @drop="handleDrop($event)"
           @click="if(!hasFile) document.getElementById('relay-file-input').click()">
        <template x-if="!hasFile">
          <div class="drop-prompt">
            <span class="drop-icon" aria-hidden="true"><svg class="icon"><use href="#i-plus"/></svg></span>
            <p class="drop-main-text">แตะเพื่อเลือกไฟล์หรือรูปภาพ</p>
            <p class="drop-sub-text">ไม่เกิน 20 MB · ลากวาง หรือกด ⌘+V เพื่อวางรูปจากคลิปบอร์ด</p>
          </div>
        </template>
        <template x-if="hasFile">
          <div class="file-chip-card" @click.stop>
            <template x-if="filePreviewUrl"><img :src="filePreviewUrl" class="file-thumb" alt="Preview"></template>
            <template x-if="!filePreviewUrl"><div class="file-icon-placeholder" aria-hidden="true">FILE</div></template>
            <div class="grow file-chip-info">
              <strong class="file-chip-name" x-text="fileName"></strong>
              <small class="file-chip-meta" x-text="fileSizeFormatted + ' · ' + (isImageFile ? 'รูปภาพ' : 'เอกสาร')"></small>
            </div>
            <button type="button" class="btn btn-sm btn-ghost btn-danger" @click="removeFile()">ลบ</button>
          </div>
        </template>
        <input type="file" id="relay-file-input" hidden @change="handleFileSelect($event)">
      </div>
      <label class="field caption-field" x-show="hasFile">คำบรรยาย <small>ไม่บังคับ</small>
        <input type="text" id="relay-caption-input" x-model="captionText" placeholder="คำบรรยายภาพหรือเอกสาร" maxlength="1024" @keydown.enter="submit()">
      </label>
      <button class="btn btn-primary btn-block relay-submit-btn" type="button" :disabled="isSending || !hasFile" @click="submit()">
        <svg class="icon icon-sm"><use href="#i-send"/></svg><span x-text="isSending ? 'กำลังส่ง…' : 'ส่งเข้า Telegram'"></span>
      </button>
    </section>

    <!-- Progress -->
    <div class="card relay-progress-card" x-show="isSending" x-transition x-cloak aria-live="polite">
      <div class="relay-progress-heading">
        <span x-text="progressText"></span>
        <span x-show="uploadProgressMode === 'determinate'" x-text="uploadProgress + '%'" aria-hidden="true"></span>
      </div>
      <div class="relay-progress-track" :class="uploadProgressMode" role="progressbar" aria-label="ความคืบหน้าการส่ง" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="uploadProgressMode === 'determinate' ? uploadProgress : null">
        <span class="relay-progress-fill" :style="uploadProgressMode === 'determinate' ? `width: ${uploadProgress}%` : ''"></span>
      </div>
      <small class="muted" x-text="uploadProgressMode === 'determinate' ? 'กำลังอัปโหลดไฟล์ไปยังเซิร์ฟเวอร์' : 'กำลังรอการตอบกลับจาก Telegram'" x-show="activeTab === 'file'"></small>
    </div>

    <div class="relay-status-banner" :class="statusType" x-show="statusText && statusType !== 'info'" x-transition x-cloak role="status"><span x-text="statusText"></span></div>

    <p class="page-footer">ไฟล์สูงสุด 20 MB · รูปภาพจะแสดงพรีวิวในแชท</p>
  </main>

  <nav class="task-nav" aria-label="หน้าหลัก">
    <a class="task-link" href="/?tab=overview"><svg class="icon"><use href="#i-overview"/></svg><span>ภาพรวม</span></a>
    <a class="task-link" href="/schedule"><svg class="icon"><use href="#i-calendar"/></svg><span>ตาราง</span></a>
    <a class="task-link" href="/live"><svg class="icon"><use href="#i-pin"/></svg><span>แผนที่</span></a>
    <a class="task-link active" href="/relay" aria-current="page"><svg class="icon"><use href="#i-send"/></svg><span>Telegram</span></a>
  </nav>
</body>
</html>
